name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '37 3 * * 2'

permissions:
  contents: read

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: .go-version
        check-latest: true
    - run: make build
    - run: make test
    - name: Run staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... # Staticcheck 2026.2.2
    - name: Check known vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: .go-version
        check-latest: true
    - run: go build ./...
    - run: go test ./...

  build:
    name: CI
    needs: [linux, windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require both platforms
      env:
        LINUX_RESULT: ${{ needs.linux.result }}
        WINDOWS_RESULT: ${{ needs.windows.result }}
      run: |
        test "$LINUX_RESULT" = success
        test "$WINDOWS_RESULT" = success
