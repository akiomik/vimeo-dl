name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: CI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: .go-version
        check-latest: true
    - run: make build
    - run: make test
    - uses: dominikh/staticcheck-action@v1.4.1
      with:
        version: "2026.2.2"
        install-go: false

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: .go-version
        check-latest: true
    - run: go build ./...
    - run: go test ./...
