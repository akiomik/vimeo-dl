name: goreleaser

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/goreleaser.yml'
      - '.goreleaser.yaml'
      - 'scripts/prepare-release-notes.sh'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          check-latest: true
      - run: go build ./...
      - run: go test ./...
      - if: matrix.os == 'ubuntu-latest'
        name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... # Staticcheck 2026.2.2
      - if: matrix.os == 'ubuntu-latest'
        name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  goreleaser:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          check-latest: true
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/prepare-release-notes.sh "$RELEASE_TAG" "$RUNNER_TEMP/vimeo-dl-release-notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes=${{ runner.temp }}/vimeo-dl-release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
